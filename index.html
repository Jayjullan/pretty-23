<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited, Birthday Girl! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush-pink: #f7d6df;
            --deep-pink: #e8a5b8;
            --olive-green: #556b2f;
            --dark-green: #384223;
            --cream-bg: #fcf9f5;
            --text-color: #2f3542;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#e8a5b8 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }
        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(85, 107, 47, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--blush-pink);
            position: relative;
        }
        .envelope-header {
            background: var(--blush-pink);
            color: var(--dark-green);
            padding: 15px;
            border-radius: 12px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 1px dashed var(--olive-green);
        }
        h1 { 
            font-family: 'Playfair Display', serif;
            color: var(--olive-green); 
            margin-bottom: 5px; 
            font-size: 2rem;
        }
        p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
        .details {
            margin: 20px 0;
            line-height: 1.6;
            background: #fdf6f8;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            border-left: 4px solid var(--deep-pink);
        }
        .details p {
            margin: 5px 0;
            color: var(--dark-green);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            text-align: left;
        }
        label {
            font-weight: 500;
            font-size: 13px;
            color: var(--dark-green);
            letter-spacing: 0.5px;
        }
        select, input {
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: #fff;
            font-family: 'Poppins', sans-serif;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--olive-green);
        }
        button {
            background-color: var(--olive-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(85, 107, 47, 0.2);
        }
        button:hover { background-color: var(--dark-green); }
        #setup-status { 
            margin-top: 15px; 
            font-size: 14px; 
            color: var(--olive-green); 
            font-weight: 500;
            text-align: center; 
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="envelope-header">
            🌿 Special E-Invitation for You 🌸
        </div>
        
        <h1>Hello, Birthday Girl!</h1>
        <p>You have been cordially invited to celebrate your special milestone. Let's make it official and pick your preferences!</p>
        
        <div class="details">
            <p><strong>📍 Venue:</strong> Bakehouse</p>
            <p><strong>✨ Host:</strong> Your Best Friends</p>
        </div>

        <form id="party-form">
            <label for="party-date">Choose Your Date:</label>
            <select id="party-date" required>
                <option value="" disabled selected>-- Select Date --</option>
                <option value="August 29">August 29</option>
                <option value="August 30">August 30</option>
                <option value="August 31">August 31</option>
            </select>

            <label for="party-theme">Choose Your Theme:</label>
            <input type="text" id="party-theme" placeholder="e.g., Botanical Pink, Floral Elegance..." required>

            <button type="submit">Lock In My Party Settings</button>
            <p id="setup-status"></p>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXvhCc7N4eXrMYjwBqnfuWbaXsuR-_syQ",
            authDomain: "pretty-birthday.firebaseapp.com",
            projectId: "pretty-birthday",
            storageBucket: "pretty-birthday.firebasestorage.app",
            messagingSenderId: "113184135163",
            appId: "1:113184135163:web:3781e97fbdd244c3d6dd5e",
            measurementId: "G-ZRHQPBLCGK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('party-form');
        const statusText = document.getElementById('rsvp-status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedDate = document.getElementById('party-date').value;
            const selectedTheme = document.getElementById('party-theme').value;

            try {
                await addDoc(collection(db, "party_settings"), {
                    date: selectedDate,
                    theme: selectedTheme,
                    location: "Bakehouse",
                    timestamp: serverTimestamp()
                });
                
                statusText.style.color = "#556b2f";
                statusText.textContent = "✨ Party details saved successfully! See you at Bakehouse!";
                form.reset();
            } catch (error) {
                console.error("Error saving settings: ", error);
                statusText.style.color = "#d9534f";
                statusText.textContent = "❌ Error saving. Please try again.";
            }
        });
    </script>
</body>
</html>
