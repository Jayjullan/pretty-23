<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Bestie! 🎉</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --bg-color: #fff0f3;
            --text-color: #2f3542;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 { color: var(--primary-color); margin-bottom: 10px; }
        .details {
            margin: 20px 0;
            line-height: 1.6;
            background: #fff5f7;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            text-align: left;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: var(--text-color);
        }
        select, input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: white;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
            margin-top: 10px;
            text-align: center;
        }
        button:hover { opacity: 0.9; }
        #setup-status { margin-top: 10px; font-size: 14px; color: #2ed573; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello Birthday Girl! 👑</h1>
        <p>This special invitation is just for you. Let's plan your ultimate celebration!</p>
        
        <div class="details">
            <p><strong>📍 Location:</strong> Bakehouse</p>
            <p><em>Configure your party details below so we can get everything ready!</em></p>
        </div>

        <form id="party-form">
            <label for="party-date">Choose Your Date:</label>
            <select id="party-date" required>
                <option value="" disabled selected>Select a date</option>
                <option value="August 29">August 29</option>
                <option value="August 30">August 30</option>
                <option value="August 31">August 31</option>
            </select>

            <label for="party-theme">Choose Your Theme:</label>
            <input type="text" id="party-theme" placeholder="e.g., Pastel Pink, Y2K, Fairy Tale..." required>

            <button type="submit">Lock In My Party!</button>
            <p id="setup-status"></p>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAXvhCc7N4eXrMYjwBqnfuWbaXsuR-_syQ",
            authDomain: "pretty-birthday.firebaseapp.com",
            projectId: "pretty-birthday",
            storageBucket: "pretty-birthday.firebasestorage.app",
            messagingSenderId: "113184135163",
            appId: "1:113184135163:web:3781e97fbdd244c3d6dd5e",
            measurementId: "G-ZRHQPBLCGK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('party-form');
        const statusText = document.getElementById('setup-status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedDate = document.getElementById('party-date').value;
            const selectedTheme = document.getElementById('party-theme').value;

            try {
                await addDoc(collection(db, "party_settings"), {
                    date: selectedDate,
                    theme: selectedTheme,
                    location: "Bakehouse",
                    timestamp: serverTimestamp()
                });
                
                statusText.style.color = "#2ed573";
                statusText.textContent = "✨ Party details saved! Time to celebrate!";
                form.reset();
            } catch (error) {
                console.error("Error saving settings: ", error);
                statusText.style.color = "#ff4757";
                statusText.textContent = "❌ Error saving. Please try again.";
            }
        });
    </script>
</body>
</html>
