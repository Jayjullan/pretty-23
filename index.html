<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited, Birthday Girl! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush-pink: #f7d6df;
            --deep-pink: #e8a5b8;
            --olive-green: #556b2f;
            --dark-green: #384223;
            --cream-bg: #fcf9f5;
            --text-color: #2f3542;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#e8a5b8 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }
        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(85, 107, 47, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--blush-pink);
            position: relative;
        }
        .envelope-header {
            background: var(--blush-pink);
            color: var(--dark-green);
            padding: 15px;
            border-radius: 12px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 1px dashed var(--olive-green);
        }
        h1 { 
            font-family: 'Playfair Display', serif;
            color: var(--olive-green); 
            margin-bottom: 5px; 
            font-size: 2rem;
        }
        p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
        .details {
            margin: 20px 0;
            line-height: 1.6;
            background: #fdf6f8;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            border-left: 4px solid var(--deep-pink);
        }
        .details p {
            margin: 5px 0;
            color: var(--dark-green);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            text-align: left;
        }
        label {
            font-weight: 500;
            font-size: 13px;
            color: var(--dark-green);
            letter-spacing: 0.5px;
        }
        select, input {
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background: #fff;
            font-family: 'Poppins', sans-serif;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--olive-green);
        }
        button {
            background-color: var(--olive-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(85, 107, 47, 0.2);
            width: 100%;
        }
        button:hover { background-color: var(--dark-green); }
        .upload-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
            text-align: left;
        }
        #preview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
        #setup-status, #upload-status { 
            margin-top: 10px; 
            font-size: 13px; 
            font-weight: 500;
            text-align: center; 
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="envelope-header">
            🌿 Special E-Invitation for You 🌸
        </div>
        
        <h1>Hello, Birthday Girl!</h1>
        <p>You have been cordially invited to celebrate your special milestone. Let's make it official and pick your preferences!</p>
        
        <div class="details">
            <p><strong>📍 Venue:</strong> Bakehouse</p>
            <p><strong>✨ Host:</strong> Your Best Friends</p>
        </div>

        <!-- Birthday Girl Setup Form -->
        <form id="party-form">
            <label for="party-date">Choose Your Date:</label>
            <select id="party-date" required>
                <option value="" disabled selected>-- Select Date --</option>
                <option value="August 29">August 29</option>
                <option value="August 30">August 30</option>
                <option value="August 31">August 31</option>
            </select>

            <label for="party-theme">Choose Your Theme:</label>
            <input type="text" id="party-theme" placeholder="e.g., Botanical Pink, Floral Elegance..." required>

            <button type="submit">Lock In My Party Settings</button>
            <p id="setup-status"></p>
        </form>

        <!-- Base64 Image Uploader Section -->
        <div class="upload-section">
            <label>Upload Party/Theme Image to DB:</label>
            <input type="file" id="image-input" accept="image/*" style="margin-top: 8px;">
            <br>
            <img id="preview" alt="Preview">
            <button type="button" id="upload-btn" style="background-color: var(--deep-pink); margin-top: 10px;">Upload Image to Database</button>
            <p id="upload-status"></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXvhCc7N4eXrMYjwBqnfuWbaXsuR-_syQ",
            authDomain: "pretty-birthday.firebaseapp.com",
            projectId: "pretty-birthday",
            storageBucket: "pretty-birthday.firebasestorage.app",
            messagingSenderId: "113184135163",
            appId: "1:113184135163:web:3781e97fbdd244c3d6dd5e",
            measurementId: "G-ZRHQPBLCGK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Party form submission
        const form = document.getElementById('party-form');
        const statusText = document.getElementById('setup-status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedDate = document.getElementById('party-date').value;
            const selectedTheme = document.getElementById('party-theme').value;

            try {
                await addDoc(collection(db, "party_settings"), {
                    date: selectedDate,
                    theme: selectedTheme,
                    location: "Bakehouse",
                    timestamp: serverTimestamp()
                });
                statusText.style.color = "#556b2f";
                statusText.textContent = "✨ Party details saved successfully!";
                form.reset();
            } catch (error) {
                console.error("Error saving settings: ", error);
                statusText.style.color = "#d9534f";
                statusText.textContent = "❌ Error saving settings.";
            }
        });

        // ============================================================
        // FAST IMAGE UPLOAD
        // ============================================================
        // Images are uploaded directly to Cloudinary from the browser.
        // Firestore only stores the resulting URL, so large image data
        // never passes through Firestore.
        //
        // SET THESE TWO VALUES from your Cloudinary dashboard:
        //   CLOUDINARY_CLOUD_NAME
        //   CLOUDINARY_UPLOAD_PRESET
        //
        // The upload preset must be an UNSIGNED upload preset.
        // ============================================================

        const CLOUDINARY_CLOUD_NAME = "Jayjullan";
        const CLOUDINARY_UPLOAD_PRESET = "pretty";

        const imageInput = document.getElementById('image-input');
        const preview = document.getElementById('preview');
        const uploadBtn = document.getElementById('upload-btn');
        const uploadStatus = document.getElementById('upload-status');

        let compressedBlob = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];

            if (!file) {
                compressedBlob = null;
                preview.style.display = 'none';
                return;
            }

            if (!file.type.startsWith('image/')) {
                uploadStatus.style.color = '#d9534f';
                uploadStatus.textContent = '❌ Please select an image file.';
                imageInput.value = '';
                compressedBlob = null;
                preview.style.display = 'none';
                return;
            }

            if (file.size > 15 * 1024 * 1024) {
                uploadStatus.style.color = '#d9534f';
                uploadStatus.textContent = '❌ Please choose an image smaller than 15 MB.';
                imageInput.value = '';
                compressedBlob = null;
                preview.style.display = 'none';
                return;
            }

            uploadStatus.style.color = '#555';
            uploadStatus.textContent = 'Preparing image...';

            const reader = new FileReader();

            reader.onload = (event) => {
                const img = new Image();

                img.onload = () => {
                    const canvas = document.createElement('canvas');

                    // Smaller image = faster upload while still looking good.
                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;

                    let width = img.naturalWidth;
                    let height = img.naturalHeight;

                    if (width > MAX_WIDTH || height > MAX_HEIGHT) {
                        const scale = Math.min(
                            MAX_WIDTH / width,
                            MAX_HEIGHT / height
                        );

                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(
                        (blob) => {
                            if (!blob) {
                                uploadStatus.style.color = '#d9534f';
                                uploadStatus.textContent = '❌ Could not process the image.';
                                compressedBlob = null;
                                return;
                            }

                            compressedBlob = blob;

                            if (preview.dataset.objectUrl) {
                                URL.revokeObjectURL(preview.dataset.objectUrl);
                            }

                            const objectUrl = URL.createObjectURL(blob);
                            preview.dataset.objectUrl = objectUrl;
                            preview.src = objectUrl;
                            preview.style.display = 'block';

                            const sizeKB = Math.round(blob.size / 1024);

                            uploadStatus.style.color = '#556b2f';
                            uploadStatus.textContent =
                                `✨ Ready to upload (${sizeKB} KB).`;
                        },
                        'image/jpeg',
                        0.72
                    );
                };

                img.onerror = () => {
                    uploadStatus.style.color = '#d9534f';
                    uploadStatus.textContent = '❌ Could not read this image.';
                    compressedBlob = null;
                };

                img.src = event.target.result;
            };

            reader.onerror = () => {
                uploadStatus.style.color = '#d9534f';
                uploadStatus.textContent = '❌ Could not read the selected file.';
                compressedBlob = null;
            };

            reader.readAsDataURL(file);
        });

        uploadBtn.addEventListener('click', async () => {
            if (!compressedBlob) {
                uploadStatus.style.color = '#d9534f';
                uploadStatus.textContent = '❌ Please select an image first!';
                return;
            }

            if (
                CLOUDINARY_CLOUD_NAME === "YOUR_CLOUD_NAME" ||
                CLOUDINARY_UPLOAD_PRESET === "YOUR_UNSIGNED_UPLOAD_PRESET"
            ) {
                uploadStatus.style.color = '#d9534f';
                uploadStatus.textContent =
                    '❌ Add your Cloudinary Cloud Name and Upload Preset first.';
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            uploadStatus.style.color = '#333';
            uploadStatus.textContent = '☁️ Uploading image...';

            try {
                const formData = new FormData();

                formData.append('file', compressedBlob, 'party-image.jpg');
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                formData.append('folder', 'birthday-party');

                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.secure_url) {
                    throw new Error(
                        result.error?.message || 'Cloudinary upload failed.'
                    );
                }

                // Save only the small URL/metadata in Firestore.
                await addDoc(collection(db, "images"), {
                    imageUrl: result.secure_url,
                    publicId: result.public_id || null,
                    width: result.width || null,
                    height: result.height || null,
                    format: result.format || 'jpg',
                    bytes: result.bytes || compressedBlob.size,
                    timestamp: serverTimestamp()
                });

                uploadStatus.style.color = '#556b2f';
                uploadStatus.textContent =
                    '✨ Image uploaded successfully!';

                imageInput.value = '';
                preview.style.display = 'none';
                compressedBlob = null;

                if (preview.dataset.objectUrl) {
                    URL.revokeObjectURL(preview.dataset.objectUrl);
                    delete preview.dataset.objectUrl;
                }

            } catch (error) {
                console.error('Image upload error:', error);

                uploadStatus.style.color = '#d9534f';
                uploadStatus.textContent =
                    `❌ Upload failed: ${error.message}`;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Image to Database';
            }
        });

    </script>
</body>
</html>
